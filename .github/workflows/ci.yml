name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only need to read the repository.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: PYTHONPATH=src pytest -q

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [terraform, demo]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.10'

      - name: Check formatting
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check -recursive

      - name: Initialise without a backend
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false

      - name: Validate configuration
        working-directory: ${{ matrix.dir }}
        run: terraform validate

  iac-scan:
    # Informational: reports security findings in the real stack without failing the build.
    # The demo folder is skipped on purpose because it is insecure by design.
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Terraform
        run: checkov -d terraform --framework terraform --soft-fail
